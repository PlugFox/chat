# Local development services: `mise run db:up` / `mise run db:down`.
# Production deployment lives in compose.yaml (docs/deployment.md, later).
name: chat-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres:

# Local development services: `mise run db:up` / `mise run db:down`.
# Production deployment lives in compose.yaml (docs/deployment.md, later).
name: chat-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Revocation store tests (server/tests/redis_store.rs) and a multi-replica setup.
  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--maxmemory-policy", "noeviction", "--save", ""]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches sign-in mail: SMTP on 127.0.0.1:1025, web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres:

[workspace]
resolver = "3"
members = ["crates/crypto", "crates/protocol", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
chat-crypto = { path = "crates/crypto" }
chat-protocol = { path = "crates/protocol" }

# --- crypto (docs/crypto.md, Suite v1) ---
# default-features = false: X25519 + ChaCha20-Poly1305 only; no ML-KEM, NIST curves or AES.
hpke = { version = "0.14.1", default-features = false, features = [
  "alloc",
  "x25519",
  "chacha",
  "getrandom",
] }
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.1"
# sys_rng: the OS RNG as a rand_core RNG; wasm_js: crypto.getRandomValues in the browser.
getrandom = { version = "0.4.3", features = ["sys_rng"] }
rand_core = "0.10.1"
zeroize = { version = "1.9.1", features = ["derive"] }
subtle = "2.6.1"
thiserror = "2.0.19"

# --- test utilities ---
rand_chacha = "0.10.0"
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
hex = "0.4.3"
wasm-bindgen-test = "0.3.79"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
expect_used = "warn"

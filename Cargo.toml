[workspace]
resolver = "3"
members = ["crates/crypto", "crates/protocol", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
chat-crypto = { path = "crates/crypto" }
chat-protocol = { path = "crates/protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"

# Builds both images on every PR that touches what they contain; nothing is
# pushed. Releases with published images come later (docs/deployment.md).
name: Docker

on:
  pull_request:
    branches: [master]
    paths:
      - "crates/**"
      - "server/**"
      - "client/**"
      - "deploy/**"
      - "Cargo.*"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [server, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build --build-arg GIT_COMMIT="${GITHUB_SHA::12}" -f deploy/${{ matrix.image }}.Dockerfile -t chat-${{ matrix.image }}:ci .
      - name: Compose file is valid
        if: matrix.image == 'server'
        run: docker compose -f deploy/compose.yaml --env-file deploy/.env.example config -q

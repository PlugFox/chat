# CI — every pull request to master, every push to master, and manual runs.
#
#   rust    rustfmt, clippy -D warnings, tests, crypto tests in WASM (Node)
#   client  Biome, Stylelint, type check, Vitest, build
#   repo    typos, taplo, actionlint, gitleaks (full history)
#
# Supply-chain checks live in security.yml.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml picks the channel, components and the wasm32 target.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Node and wasm-bindgen-test-runner for the WASM leg (.cargo/config.toml).
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: node github:wasm-bindgen/wasm-bindgen
      - run: cargo fmt --all --check
      # --locked: CI builds exactly the committed Cargo.lock.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p chat-crypto --target wasm32-unknown-unknown --locked

  client:
    name: Client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: bun
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run lint:css
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  repo:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: typos taplo actionlint gitleaks
      - run: typos
      - run: taplo lint
      - run: actionlint
      - run: gitleaks git --no-banner --redact

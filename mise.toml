# Tool versions and tasks (https://mise.jdx.dev).
# One-time setup: `mise install && mise run setup`. Rust itself comes from
# rustup (rust-toolchain.toml). CI installs the same versions via jdx/mise-action.
# A pin names its backend (`aqua:owner/repo`, `github:owner/repo`) rather than a
# registry shortname, so what a version resolves to is recorded here. Rust is
# rustup's (rust-toolchain.toml).
[tools]
# The client: package manager, bundler runtime, tests.
"aqua:oven-sh/bun" = "1.4.4"
# Runs the WASM tests of crates/crypto (wasm-bindgen-test-runner).
node = "24.22.1"
# Must match the wasm-bindgen version in Cargo.lock exactly.
"github:wasm-bindgen/wasm-bindgen" = "0.2.129"

# The commit gate (lefthook.yml) and `mise run check:repo`.
"aqua:evilmartians/lefthook" = "2.2.2"
"aqua:gitleaks/gitleaks" = "8.30.1" # no key or token enters history
"aqua:crate-ci/typos" = "1.51.1" # docs are the agents' memory; a typo is a wrong memory
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:tamasfe/taplo" = "0.10.0"
"aqua:koalaman/shellcheck" = "0.11.0" # .claude/hooks/*.sh run in every session
"ubi:bnjbvr/cargo-machete" = "0.9.2" # an unused dependency is attack surface for nothing

# Supply chain (`mise run audit`, security.yml).
"github:EmbarkStudios/cargo-deny" = "0.19.4"
"github:rustsec/rustsec" = { version = "cargo-audit/v0.22.1", bin = "cargo-audit" }

# Local development defaults (deploy/dev.compose.yaml); not secrets.
# DATABASE_URL is what sqlx (migrations, #[sqlx::test]) reads.
[env]
CHAT_DATABASE_URL = "postgres://chat:chat@127.0.0.1:5433/chat"
DATABASE_URL = "postgres://chat:chat@127.0.0.1:5433/chat"
# Redis store tests; the leg fails rather than skips when Valkey is down.
CHAT_TEST_REDIS_URL = "redis://127.0.0.1:6380"

[tasks.setup]
description = "Install client dependencies and git hooks"
run = [
  "bun install --cwd client",
  "bunx --cwd client playwright install chromium",
  "lefthook install",
]

[tasks."db:up"]
description = "Start local PostgreSQL (:5433), Valkey (:6380) and Mailpit (:1025, UI :8025)"
run = "docker compose -f deploy/dev.compose.yaml up -d --wait"

[tasks."db:down"]
description = "Stop local services (data is kept; add -v by hand to drop it)"
run = "docker compose -f deploy/dev.compose.yaml down"

[tasks."dev:server"]
description = "Server on http://localhost:8080 (needs db:up)"
env = { CHAT_LISTEN = "127.0.0.1:8080", RUST_LOG = "info,chat_server=debug", CHAT_SMTP_URL = "smtp://127.0.0.1:1025", CHAT_SMTP_FROM = "Vault Chat <chat@localhost>" }
run = "cargo run -p chat-server"

[tasks.dev]
description = "Client dev server on http://localhost:3000"
dir = "client"
run = "bun run dev"

[tasks.fmt]
description = "Format Rust, TOML and client code"
run = [
  "cargo fmt --all",
  "taplo format",
  "bun run --cwd client format",
  "bun run --cwd client lint:css --fix",
]

[tasks.check]
description = "Everything CI runs"
depends = ["check:rust", "check:client", "check:e2e", "check:repo"]

[tasks."check:rust"]
description = "rustfmt, clippy, tests (needs db:up), crypto tests in WASM (Node)"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo test --workspace --locked",
  "cargo test -p chat-crypto --target wasm32-unknown-unknown --locked",
]

[tasks.fuzz]
description = "Run every chat-crypto fuzz target (needs nightly and cargo-fuzz): mise run fuzz [seconds]"
dir = "crates/crypto"
run = """
for target in $(cargo +nightly fuzz list); do
  cargo +nightly fuzz run "$target" -- -max_total_time={{arg(name='seconds', default='60')}}
done
"""

[tasks."check:client"]
description = "WASM, Biome, Stylelint, type check, unit tests, build"
dir = "client"
run = [
  "bun run wasm",
  "bun run lint",
  "bun run lint:css",
  "bun run typecheck",
  "bun run test",
  "bun run build",
]

[tasks."check:e2e"]
description = "Playwright on a test build: axe in every theme, 48px targets, themes, i18n, CSP (phone + desktop)"
dir = "client"
run = "bun run test:e2e"

[tasks."check:repo"]
description = "Typos, TOML lint, workflow lint, shell lint, unused dependencies, secret scan"
run = [
  "typos",
  "taplo lint",
  "actionlint",
  "shellcheck .claude/hooks/*.sh",
  "cargo machete",
  "gitleaks git --no-banner --redact",
]

[tasks.audit]
description = "Supply chain: cargo deny, cargo audit, bun audit"
run = [
  "cargo deny --locked check",
  "cargo audit",
  "bun audit --cwd client",
]

id: no-inner-html
language: tsx
severity: error
message: No HTML from strings; render text through JSX (the strict CSP and the threat model assume no injected markup).
rule:
  any:
    - kind: jsx_attribute
      has:
        kind: property_identifier
        regex: ^(innerHTML|outerHTML)$
    - pattern: $E.innerHTML = $V
    - pattern: $E.outerHTML = $V
    - pattern: $E.insertAdjacentHTML($$$)
files:
  - client/src/**/*.tsx
